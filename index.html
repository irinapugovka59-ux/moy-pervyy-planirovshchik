<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Персональный двухнедельный планировщик задач">
    <title>Планировщик Иры</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">И</span>
          <div>
            <p class="eyebrow">Личный планировщик</p>
            <h1>Планировщик Иры</h1>
          </div>
        </div>

        <div class="toolbar" aria-label="Управление календарём">
          <div class="date-navigation">
            <button class="icon-button" id="previous-week" type="button" aria-label="Предыдущая неделя">
              <span aria-hidden="true">←</span>
            </button>
            <button class="secondary-button" id="today-button" type="button">Сегодня</button>
            <button class="icon-button" id="next-week" type="button" aria-label="Следующая неделя">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <button class="primary-button" id="new-task-button" type="button">
            <span aria-hidden="true">＋</span>
            Новая задача
          </button>
          <button class="secondary-action" id="categories-button" type="button">Категории</button>
        </div>
      </header>

      <div class="status-banner" id="status-banner" role="alert" hidden></div>

      <main>
        <section class="filters panel" aria-labelledby="filters-title">
          <div class="filters-heading">
            <div>
              <p class="section-kicker">Отображение</p>
              <h2 class="filters-title" id="filters-title">Фильтры</h2>
            </div>
            <button class="text-button" id="reset-filters" type="button">Сбросить</button>
          </div>
          <div class="filter-grid">
            <label class="field compact-field">
              <span>Состояние</span>
              <select id="status-filter">
                <option value="all">Все задачи</option>
                <option value="active">Активные</option>
                <option value="completed">Выполненные</option>
              </select>
            </label>
            <fieldset class="filter-group">
              <legend>Приоритет</legend>
              <label><input type="checkbox" name="priority-filter" value="low"> Низкий</label>
              <label><input type="checkbox" name="priority-filter" value="normal"> Обычный</label>
              <label><input type="checkbox" name="priority-filter" value="urgent"> Срочный</label>
            </fieldset>
            <fieldset class="filter-group category-filter-group">
              <legend>Категории</legend>
              <div class="checkbox-list" id="category-filters"></div>
            </fieldset>
            <label class="field compact-field">
              <span>Перенос</span>
              <select id="carried-filter">
                <option value="all">Все задачи</option>
                <option value="carried">Только перенесённые</option>
                <option value="not-carried">Без переносов</option>
              </select>
            </label>
          </div>
        </section>

        <section class="inbox panel" aria-labelledby="inbox-title">
          <button class="section-toggle" id="inbox-toggle" type="button" aria-expanded="true" aria-controls="inbox-content">
            <span class="section-heading">
              <span class="section-icon" aria-hidden="true">⌁</span>
              <span>
                <span class="section-kicker">Без даты</span>
                <span class="section-title" id="inbox-title">Входящие</span>
              </span>
            </span>
            <span class="section-meta">
              <span class="count-badge" aria-label="0 задач">0</span>
              <span class="chevron" aria-hidden="true">⌃</span>
            </span>
          </button>
          <div class="inbox-content" id="inbox-content">
            <div class="inbox-actions"><button class="small-button" id="inbox-add-task" type="button">＋ Добавить во входящие</button></div>
            <div class="task-list" id="inbox-task-list"></div>
          </div>
        </section>

        <section class="calendar-section" aria-labelledby="calendar-title">
          <div class="calendar-heading">
            <div>
              <p class="eyebrow">План на две недели</p>
              <h2 id="calendar-title">Текущий период</h2>
            </div>
            <p class="date-range" id="date-range" aria-live="polite"></p>
          </div>
          <div class="weeks-grid" id="weeks-grid"></div>
        </section>
      </main>

      <dialog class="modal" id="task-dialog" aria-labelledby="task-dialog-title">
        <form class="modal-card" id="task-form" novalidate>
          <header class="modal-header">
            <div>
              <p class="section-kicker" id="task-dialog-kicker">Задача</p>
              <h2 id="task-dialog-title">Новая задача</h2>
            </div>
            <button class="close-button" type="button" data-close-task aria-label="Закрыть">×</button>
          </header>
          <div class="form-grid">
            <label class="field field-wide">
              <span>Название <b aria-hidden="true">*</b></span>
              <input id="task-title" name="title" maxlength="120" autocomplete="off" required>
              <small class="field-error" data-error-for="title"></small>
            </label>
            <label class="field field-wide">
              <span>Описание</span>
              <textarea id="task-description" name="description" maxlength="1000" rows="4"></textarea>
              <small class="field-error" data-error-for="description"></small>
            </label>
            <label class="field">
              <span>Дата</span>
              <input id="task-date" name="date" type="date">
              <small class="field-error" data-error-for="date"></small>
            </label>
            <label class="field">
              <span>Время</span>
              <input id="task-time" name="time" type="time">
              <small class="field-error" data-error-for="time"></small>
            </label>
            <label class="field">
              <span>Приоритет</span>
              <select id="task-priority" name="priority">
                <option value="low">Низкий</option>
                <option value="normal" selected>Обычный</option>
                <option value="urgent">Срочный</option>
              </select>
              <small class="field-error" data-error-for="priority"></small>
            </label>
            <label class="field">
              <span>Категория</span>
              <select id="task-category" name="categoryId"></select>
            </label>
          </div>
          <p class="form-note" id="task-autosave-note" hidden>Изменения сохраняются автоматически.</p>
          <footer class="modal-footer">
            <button class="secondary-action" type="button" data-close-task>Отмена</button>
            <button class="primary-button" id="task-submit" type="submit">Создать</button>
          </footer>
        </form>
      </dialog>

      <dialog class="modal" id="categories-dialog" aria-labelledby="categories-title">
        <div class="modal-card categories-modal-card">
          <header class="modal-header">
            <div>
              <p class="section-kicker">Настройки</p>
              <h2 id="categories-title">Категории</h2>
            </div>
            <button class="close-button" id="close-categories" type="button" aria-label="Закрыть">×</button>
          </header>
          <form class="category-create" id="category-form" novalidate>
            <label class="field">
              <span>Новая категория</span>
              <input id="category-name" maxlength="40" autocomplete="off" placeholder="Например, Учёба">
              <small class="field-error" id="category-create-error"></small>
            </label>
            <label class="color-field">
              <span>Цвет</span>
              <input id="category-color" type="color" value="#79bfb0">
            </label>
            <button class="primary-button" type="submit">Добавить</button>
          </form>
          <div class="category-list" id="category-list"></div>
        </div>
      </dialog>

      <dialog class="modal compact-modal" id="move-dialog" aria-labelledby="move-dialog-title">
        <form class="modal-card" id="move-form" novalidate>
          <header class="modal-header">
            <div>
              <p class="section-kicker">Перемещение</p>
              <h2 id="move-dialog-title">Выбрать дату</h2>
            </div>
            <button class="close-button" id="close-move-dialog" type="button" aria-label="Закрыть">×</button>
          </header>
          <label class="field">
            <span>Новая дата</span>
            <input id="move-date" type="date" required>
            <small class="field-error" id="move-date-error"></small>
          </label>
          <footer class="modal-footer">
            <button class="secondary-action" id="cancel-move-dialog" type="button">Отмена</button>
            <button class="primary-button" type="submit">Перенести</button>
          </footer>
        </form>
      </dialog>

      <footer>
        <p id="step-note">Данные остаются только в этом браузере.</p>
      </footer>
    </div>

    <noscript>
      <div class="noscript-message">Для работы планировщика необходимо включить JavaScript.</div>
    </noscript>
    <script defer src="js/config.js"></script>
    <script defer src="js/date-utils.js"></script>
    <script defer src="js/state.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/task-service.js"></script>
    <script defer src="js/category-service.js"></script>
    <script defer src="js/calendar-view.js"></script>
    <script defer src="js/task-view.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
